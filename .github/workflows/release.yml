name: release

# タグ v* を押したら、Windows 上でビルドして Release に添える。
#
# **なぜ CI でビルドするのか。**
# ここまでは開発機で publish した exe を手で上げていた。それでも動くが、
# 署名を受けるには「公開された手順で、ソースから作られた物である」ことを
# 示せる必要がある（SignPath Foundation の条件）。手元の機械で作った物は、
# 中身が本当にこのソースと一致しているか誰にも確かめられない。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 版数をタグから取る
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag -replace '^v',''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      # 2通り作る。**違いは単一ファイルの自己圧縮の有無だけ。**
      # 圧縮版は落としてすぐ実行できるが、起動時に中身をまるごとメモリへ展開する。
      # 実機で測ると 222MB / 117MB(専有) 使い、非圧縮版は 130MB / 60MB だった。
      # 資源の使用量を眺めるためのアプリが、その倍を自分で使っていては話にならない。
      # 非圧縮版は ZIP にすると 56MB で、圧縮版の exe(62MB) より小さい。
      # 冒険の決まり（保存の引き継ぎ・装備・構え・30日の模擬）と、
      # 点検の中身（NVMe/SMART の解析・基準値の差・メモリ照合・止めたら止まるか・この版で止めてある機能が出ていないか）。
      # どちらかが落ちたら出さない
      - name: テスト（冒険）
        run: dotnet test tests/PartsLife.Core.Tests -c Release
      - name: テスト（点検）
        run: dotnet test tests/PartsLife.Checks.Tests -c Release

      - name: ビルド（直接実行できる単一exe）
        run: >
          dotnet publish src/PartsLife/PartsLife.csproj -c Release -o dist
          -p:Version=${{ steps.ver.outputs.version }}

      - name: ビルド（占有の小さい版）
        run: >
          dotnet publish src/PartsLife/PartsLife.csproj -c Release -o slim
          -p:Version=${{ steps.ver.outputs.version }}
          -p:EnableCompressionInSingleFile=false

      # --- 点検の補助 exe（PartsLife.Check.exe）は v0.7.0 では作らない・署名しない・配らない ---
      # 「記憶媒体の精密チェック」を、実機での付き添い試験まで止めて出すため
      # （src/PartsLife.Checks/Features.cs の StorageCheck = false。本体は補助 exe を起こさない）。
      # 発行時の DLL の検査（PartsLife.Check.csproj の CheckHelperNativeSearch）は、この発行の中で
      # 動く物なので、補助 exe を作らなければ一緒に動かない。別の job は持っていない。
      #
      # v0.7.1 で戻すときは、Features.StorageCheck を true にしたうえで、次の3か所を戻す:
      #   1. ここに発行の手順を足す（検査も一緒に戻る。地図が無い・読めないときは発行が止まる）
      #        - name: ビルド（点検の補助 exe）
      #          run: >
      #            dotnet publish src/PartsLife.Check/PartsLife.Check.csproj -c Release -o helper
      #            -p:Version=${{ steps.ver.outputs.version }}
      #   2. 署名に出す分と、署名済みに差し替える分に PartsLife.Check.exe を足す
      #        Copy-Item helper/PartsLife.Check.exe sign/PartsLife.Check.exe
      #        Copy-Item signed/PartsLife.Check.exe helper/PartsLife.Check.exe -Force
      #   3. ZIP に helper/PartsLife.Check.exe を足す（SIGNING.md・README の「何を配っているか」も）

      - name: 署名に出す分をまとめる
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path sign | Out-Null
          Copy-Item dist/PartsLife.exe sign/PartsLife.exe
          Copy-Item slim/PartsLife.exe sign/PartsLife-slim.exe

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: PartsLife-unsigned
          path: sign/*.exe
          if-no-files-found: error

      # --- 署名 -------------------------------------------------------------
      # SignPath の設定が入るまでは丸ごと飛ばす。設定が済めば自動で効き始める。
      # 署名は SignPath 側で**人の承認**を経てから返ってくる（条件のひとつ）。
      - name: 署名を依頼する
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: parts-life
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: 署名済みに差し替える
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          Copy-Item signed/PartsLife.exe dist/PartsLife.exe -Force
          Copy-Item signed/PartsLife-slim.exe slim/PartsLife.exe -Force

      # --- 公開 -------------------------------------------------------------
      # ZIP の中身は占有の小さい PartsLife.exe 1つだけ。ほかの物（補助 exe など）が紛れ込んでいたら止める
      - name: ZIP に詰める
        shell: pwsh
        run: |
          Compress-Archive -Path slim/PartsLife.exe -DestinationPath dist/PartsLife.zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/PartsLife.zip).Path)
          try { $names = @($z.Entries | ForEach-Object { $_.FullName }) } finally { $z.Dispose() }
          "ZIP: $($names -join ', ')"
          if (($names -join ',') -ne 'PartsLife.exe') { throw "unexpected ZIP contents: $($names -join ', ')" }

      # 指紋は公開する物（下の files）のうち SHA256.txt 以外の全部。files を変えたらここも揃える
      - name: 中身の指紋を出す
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @("dist/PartsLife.zip", "dist/PartsLife.exe")) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $lines += "{0}  {1}" -f $h, (Split-Path $f -Leaf)
          }
          $lines | Tee-Object -FilePath dist/SHA256.txt
          $sig = Get-AuthenticodeSignature dist/PartsLife.exe
          "署名: $($sig.Status)  $($sig.SignerCertificate.Subject)"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/PartsLife.zip
            dist/PartsLife.exe
            dist/SHA256.txt
          fail_on_unmatched_files: true
